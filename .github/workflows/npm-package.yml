name: Build and Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # Lets npm trusted publishing authenticate with GitHub's OIDC token

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version
        run: npm --no-git-tag-version version 7.0.${{ github.run_number }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Publish NPM package
        if: github.ref == 'refs/heads/main'
        run: npm publish --access public
