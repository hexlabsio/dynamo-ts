name: Pull Request Check

on:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Testing CommonJS
        run: |
          cd test-cjs
          npm install
          npm run build
          node dist/index.js

      - name: Testing ESM
        run: |
          cd test-mjs
          npm install
          npm run build
          node dist/index.js
